<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechDeva - founder console</title>
<style>
:root{--bg:#0A0E1A;--panel:#131A2C;--panel2:#0F1524;--line:#26324D;--text:#EAF1FF;
  --muted:#8A99B8;--accent:#6C8CFF;--tech:#4DA6F0;--growth:#34D07C;--warn:#E0A458;
  --danger:#E06A6A;--gold:#E8C547;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--panel2);border-right:1px solid var(--line);padding:20px 0;
  display:flex;flex-direction:column}
.brand{padding:0 20px 18px;font-weight:800;letter-spacing:.14em;font-size:13px;color:var(--muted)}
.brand b{color:var(--gold)}
nav{flex:1;overflow:auto}
.navgrp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5c6a8a;
  padding:16px 20px 6px}
nav a{display:flex;justify-content:space-between;gap:8px;align-items:center;
  padding:8px 20px;color:var(--muted);text-decoration:none;font-size:13.5px;
  border-left:2px solid transparent}
nav a:hover{color:var(--text);background:#0c1220}
nav a.on{color:var(--text);background:#141c30;border-left-color:var(--accent);font-weight:600}
nav a .tag{font-size:11px;color:var(--warn)}
.sidefoot{padding:14px 20px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
main{min-width:0;padding:24px 28px 80px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.tools{display:flex;gap:8px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);
  border-radius:9px;padding:8px 14px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#08101f;font-weight:600}
button.tiny{padding:4px 9px;font-size:12px;border-radius:7px}
.grid{display:grid;gap:14px;margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.k-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.k-value{font-size:29px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.k-note{font-size:12px;color:var(--muted);margin-top:4px}
.good{color:var(--growth)}.warn{color:var(--warn)}.bad{color:var(--danger)}.dim{color:var(--muted)}
section{margin-top:24px}
section h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:600;padding:0 10px 9px;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--line)}
tr:hover td{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.name{font-weight:600}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.active{color:var(--growth);border-color:#1e5a3c}
.pill.trial{color:var(--tech);border-color:#1d4368}
.fee{width:104px;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:7px;padding:6px 8px;font:inherit;text-align:right}
.fee:focus{outline:none;border-color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar i{display:block;width:100%;border-radius:6px 6px 0 0;min-height:2px;
  background:linear-gradient(180deg,var(--accent),#2a3f86)}
.bar span{font-size:10px;color:var(--muted)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.row button{white-space:nowrap}
.health{display:flex;gap:18px;flex-wrap:wrap}
.health div{display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--growth)}.dot.bad{background:var(--danger)}.dot.warn{background:var(--warn)}
.pay{display:none;gap:8px;margin-top:8px}
.pay input{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:7px;padding:6px 8px;font:inherit;width:110px}
#login{max-width:380px;margin:14vh auto;padding:26px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r)}
#login input{width:100%;margin:8px 0;padding:11px;background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit}
.err{color:var(--danger);font-size:13px;min-height:18px}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{display:none}}
</style></head><body>

<div id="login">
  <div class="brand" style="padding:0 0 14px">TECH<b>DEVA</b></div>
  <div class="sub">Founder console. techdeva_admin only.</div>
  <form id="lf">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="primary" id="lgo" style="width:100%">Sign in</button>
  </form>
</div>

<div class="shell" id="app" style="display:none">
  <aside>
    <div class="brand">TECH<b>DEVA</b></div>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <div id="who"></div>
      <div style="margin-top:8px"><a href="#" id="out">Sign out</a></div>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div><h1 id="vtitle">Overview</h1><div class="sub" id="vsub"></div></div>
      <div class="tools"><button id="refresh">Refresh</button></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
let TOKEN = null, D = {};
const NAV = [
  ['RUNNING THE BUSINESS', [
    ['overview','Overview'], ['clients','Clients'], ['pipeline','Pipeline & trials']]],
  ['WHAT THE AI DELIVERS', [
    ['bookings','Bookings'], ['workforce','AI workforce'], ['approvals','Waiting on you']]],
  ['MONEY', [
    ['revenue','My revenue'], ['clientmoney','Client business'], ['invoices','Invoices out']]],
  ['PLATFORM', [
    ['health','Health'], ['incidents','Incidents']]]
];
const TITLES = {overview:['Overview','The whole business on one screen.'],
  clients:['Clients','Everyone onboard, what they pay, and what they are getting.'],
  pipeline:['Pipeline & trials','Who signed up and who is still on a trial.'],
  bookings:['Bookings','Appointments the AI has put in your clients diaries.'],
  workforce:['AI workforce','What each client’s agents are doing right now.'],
  approvals:['Waiting on you','Work the platform stopped on and cannot finish alone.'],
  revenue:['My revenue','What clients have paid TechDeva.'],
  clientmoney:['Client business','Money moving through your clients businesses.'],
  invoices:['Invoices out','Invoices TechDeva has issued to clients, and their status.'],
  health:['Health','Queues, workers and the AI chain.'],
  incidents:['Incidents','Anything the monitor has opened.']};

async function api(path, opts){
  opts = opts || {};
  const h = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(path, Object.assign({credentials:'include'}, opts, {headers:h}));
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.detail || ('Request failed (' + r.status + ')')); e.status = r.status; throw e; }
  return d;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => 'PKR ' + Math.round(Number(n) || 0).toLocaleString('en-US');
const when = s => { if (!s) return '-';
  const d = new Date(s), days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return 'today'; if (days === 1) return 'yesterday';
  if (days < 30) return days + 'd ago'; return String(s).slice(0,10); };
function kpi(label, value, note, cls){
  return '<div class="card"><div class="k-label">' + esc(label) + '</div><div class="k-value ' +
    (cls||'') + '">' + value + '</div><div class="k-note">' + esc(note||'') + '</div></div>';
}
function tbl(head, rows){
  if (!rows.length) return '<div class="empty">Nothing recorded yet.</div>';
  return '<table><thead><tr>' + head + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
}

// ------------------------------------------------------------------ login
document.getElementById('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('lgo'), err = document.getElementById('lerr');
  b.disabled = true; b.textContent = 'Signing in...'; err.textContent = '';
  try {
    const d = await api('/auth/login', {method:'POST', body: JSON.stringify({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('pw').value })});
    if (d.role !== 'techdeva_admin') err.textContent = 'That account is an ' + d.role + '.';
    else { TOKEN = d.token; show(); }
  } catch (ex) { err.textContent = ex.message; }
  b.disabled = false; b.textContent = 'Sign in';
});
document.getElementById('out').onclick = async e => {
  e.preventDefault();
  try { await api('/auth/logout', {method:'POST'}); } catch (x) {}
  TOKEN = null; location.href = '/portal';
};
document.getElementById('refresh').onclick = () => load();
window.addEventListener('hashchange', paint);

function show(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'grid';
  load();
}
function current(){ return (location.hash.replace('#/','') || 'overview'); }

async function load(){
  const [book, health, ops, ai, inc, over, invoices] = await Promise.all([
    api('/techdeva/book'),
    api('/techdeva/health').catch(() => null),
    api('/techdeva/operations').catch(() => null),
    api('/ai/health').catch(() => null),
    api('/incidents').catch(() => null),
    api('/techdeva/overview').catch(() => null),
    api('/techdeva/invoices').catch(() => null)
  ]);
  D = {book, health, ops, ai, inc, over, invoices};
  renderNav(); paint();
}

function renderNav(){
  const b = D.book || {}, cur = current();
  const badge = {clients: b.clients ? b.clients.length : 0,
                 approvals: b.awaiting_approval || 0,
                 incidents: (D.inc && D.inc.open) || 0};
  document.getElementById('nav').innerHTML = NAV.map(g =>
    '<div class="navgrp">' + g[0] + '</div>' + g[1].map(it =>
      '<a href="#/' + it[0] + '" class="' + (cur === it[0] ? 'on' : '') + '">' +
      '<span>' + it[1] + '</span>' +
      (badge[it[0]] ? '<span class="tag">' + badge[it[0]] + '</span>' : '') + '</a>').join('')
  ).join('');
}

function paint(){
  const v = current(), t = TITLES[v] || TITLES.overview;
  document.getElementById('vtitle').textContent = t[0];
  document.getElementById('vsub').textContent = t[1];
  renderNav();
  const el = document.getElementById('view');
  const fn = VIEWS[v] || VIEWS.overview;
  el.innerHTML = fn();
  if (v === 'clients') wireClients();
  if (v === 'invoices') wireInvoices();
}

function chart(months){
  if (!months || !months.length)
    return '<div class="empty">No payment recorded yet. Record one on a client row and this fills in.</div>';
  const max = Math.max.apply(null, months.map(m => Number(m.amount)));
  return '<div class="bars">' + months.map(m => '<div class="bar" title="' + esc(m.month) +
    ': ' + money(m.amount) + '"><i style="height:' + Math.max(2,(Number(m.amount)/max)*100) +
    '%"></i><span>' + esc(String(m.month).slice(5)) + '</span></div>').join('') +
    '</div><div class="sub">Tallest bar ' + money(max) + '.</div>';
}
function clientRows(rows){
  return rows.map(c => {
    const paidThis = Number(c.paid_this_month)||0, fee = Number(c.monthly_fee)||0;
    const owes = fee > 0 && paidThis <= 0 && c.status === 'active';
    return '<tr><td><div class="name">' + esc(c.name || 'Unnamed') + '</div>' +
      '<div class="k-note">' + esc(c.industry || '') + '</div></td>' +
      '<td><span class="pill ' + esc(c.status) + '">' + esc(c.status) + '</span></td>' +
      '<td class="num"><input class="fee" data-fee="' + esc(c.id) + '" value="' + (fee||'') + '" placeholder="0"></td>' +
      '<td class="num ' + (owes?'warn':'') + '">' + (paidThis ? money(paidThis) : '-') + '</td>' +
      '<td class="num">' + (Number(c.paid_total) ? money(c.paid_total) : '-') + '</td>' +
      '<td class="dim">' + when(c.last_paid_on) + '</td>' +
      '<td class="num">' + c.leads + '</td><td class="num">' + c.tasks_7d + '</td>' +
      '<td class="num ' + (Number(c.awaiting)?'warn':'dim') + '">' + c.awaiting + '</td>' +
      '<td class="dim">' + when(c.last_event_at) + '</td>' +
      '<td><div class="row"><button class="tiny" data-pay="' + esc(c.id) + '">Payment</button>' +
      '<button class="tiny" data-hide="' + esc(c.id) + '">Hide</button></div>' +
      '<div class="pay" id="pay-' + esc(c.id) + '"><input placeholder="Amount" data-amt="' + esc(c.id) +
      '"><button class="tiny primary" data-save="' + esc(c.id) + '">Record</button></div></td></tr>';
  });
}

const VIEWS = {
  overview(){
    const b = D.book, h = D.health || {}, o = (D.ops || {}).client_business || {};
    const unpaid = Number(b.unpaid_this_month) || 0;
    return '<div class="grid">' +
      kpi('Monthly recurring', money(b.mrr), b.paying + ' client(s) on a fee') +
      kpi('Clients onboard', b.onboard, b.trials + ' on trial') +
      kpi('Collected this month', money(b.collected_this_month), 'paid to TechDeva') +
      kpi('Still to collect', money(unpaid), unpaid ? 'no payment recorded yet' : 'nothing outstanding', unpaid ? 'warn':'good') +
      kpi('Waiting on you', b.awaiting_approval, 'decisions blocking client work', Number(b.awaiting_approval)?'warn':'') +
      kpi('Tasks waiting', h.tasks_waiting != null ? h.tasks_waiting : '-', 'held behind an upstream step') +
      '</div>' +
      '<section><h2>What clients have paid you</h2><div class="card">' + chart(b.months) + '</div></section>' +
      '<section><h2>Clients</h2><div class="card" style="padding:6px 8px">' +
        tbl('<th>Business</th><th>Status</th><th class="num">Fee</th><th class="num">Paid this month</th>' +
            '<th class="num">Paid all time</th><th>Last paid</th><th class="num">Leads</th>' +
            '<th class="num">AI 7d</th><th class="num">Waiting</th><th>Activity</th><th></th>',
            clientRows(b.clients)) + '</div></section>';
  },
  clients(){
    const b = D.book;
    return '<div class="grid">' +
      kpi('On the book', b.clients.length, 'test tenants excluded') +
      kpi('Paying', b.paying, 'have a monthly fee set') +
      kpi('On trial', b.trials, 'not yet converted') +
      kpi('Hidden', b.hidden_test_tenants, 'marked test, never deleted') + '</div>' +
      '<section><div class="card" style="padding:6px 8px">' +
        tbl('<th>Business</th><th>Status</th><th class="num">Fee</th><th class="num">Paid this month</th>' +
            '<th class="num">Paid all time</th><th>Last paid</th><th class="num">Leads</th>' +
            '<th class="num">AI 7d</th><th class="num">Waiting</th><th>Activity</th><th></th>',
            clientRows(b.clients)) + '</div>' +
      '<div class="sub" style="margin-top:8px">Type a fee and press Tab to save it. Hide removes a ' +
      'client from this book without deleting anything.</div></section>';
  },
  pipeline(){
    const s = (D.ops && D.ops.signups) || [], b = D.book;
    return '<div class="grid">' + kpi('Signups recorded', s.length, 'most recent first') +
      kpi('On trial now', b.trials, 'still inside the free window') +
      kpi('Converted', b.paying, 'have a fee against their name') + '</div>' +
      '<section><h2>Recent signups</h2><div class="card" style="padding:6px 8px">' +
      tbl('<th>Business</th><th>Industry</th><th>Status</th><th>When</th>',
        s.map(x => '<tr><td class="name">' + esc(x.business_name) + '</td><td class="dim">' +
          esc(x.industry || '-') + '</td><td><span class="pill">' + esc(x.status) + '</span></td>' +
          '<td class="dim">' + when(x.created_at) + '</td></tr>')) + '</div></section>';
  },
  bookings(){
    const o = D.ops || {}, bk = o.bookings || {};
    return '<div class="grid">' +
      kpi('Booked all time', bk.total != null ? bk.total : '-', 'across every client') +
      kpi('Upcoming', bk.upcoming != null ? bk.upcoming : '-', 'still in the future') +
      kpi('Next 7 days', bk.next_7d != null ? bk.next_7d : '-', 'this week') + '</div>' +
      '<section><h2>By client</h2><div class="card" style="padding:6px 8px">' +
      tbl('<th>Business</th><th class="num">Booked</th><th class="num">Upcoming</th>',
        (o.bookings_by_client || []).map(r => '<tr><td class="name">' + esc(r.name || 'Unnamed') +
          '</td><td class="num">' + r.booked + '</td><td class="num">' + r.upcoming + '</td></tr>')) +
      '</div></section>' +
      '<section><h2>By status</h2><div class="card" style="padding:6px 8px">' +
      tbl('<th>Status</th><th class="num">Count</th>',
        (o.bookings_by_status || []).map(r => '<tr><td>' + esc(r.status) + '</td><td class="num">' +
          r.n + '</td></tr>')) + '</div></section>';
  },
  workforce(){
    const rows = (D.over && D.over.tenants) || [], ai = D.ai || {};
    const chain = (ai.chain || []).map(c => '<tr><td class="name">' + esc(c.provider) + '</td>' +
      '<td>' + esc(c.model) + '</td><td><span class="pill">' + esc(c.state) + '</span></td>' +
      '<td class="dim">' + esc(c.reason || '-') + '</td></tr>');
    return '<div class="grid">' +
      kpi('AI workforce', esc(ai.status || 'unknown'), (ai.usable != null ? ai.usable : '?') + ' model(s) usable',
          ai.status === 'ok' ? 'good' : 'warn') +
      kpi('Running now', rows.reduce((n,r) => n + Number(r.running||0), 0), 'tasks in flight') +
      kpi('Need a person', rows.reduce((n,r) => n + Number(r.needs_human||0), 0), 'stopped for a decision','warn') +
      kpi('Waiting', rows.reduce((n,r) => n + Number(r.waiting||0), 0), 'held behind an upstream task') + '</div>' +
      '<section><h2>Per client</h2><div class="card" style="padding:6px 8px">' +
      tbl('<th>Business</th><th class="num">Leads</th><th class="num">Booked</th><th class="num">Sold</th>' +
          '<th class="num">Running</th><th class="num">Waiting</th><th class="num">Needs person</th><th>Last event</th>',
        rows.map(r => '<tr><td class="name">' + esc(r.name) + '</td><td class="num">' + r.leads +
          '</td><td class="num">' + r.booked + '</td><td class="num">' + r.sold +
          '</td><td class="num">' + r.running + '</td><td class="num">' + r.waiting +
          '</td><td class="num ' + (Number(r.needs_human)?'warn':'dim') + '">' + r.needs_human +
          '</td><td class="dim">' + when(r.last_event_at) + '</td></tr>')) + '</div></section>' +
      '<section><h2>Model chain</h2><div class="card" style="padding:6px 8px">' +
      tbl('<th>Provider</th><th>Model</th><th>State</th><th>Why</th>', chain) + '</div></section>';
  },
  approvals(){
    const rows = ((D.book || {}).clients || []).filter(c => Number(c.awaiting) > 0);
    if (!rows.length) return '<div class="empty">Nothing is waiting on you. Anything that spends ' +
      'money or posts publicly stops here first.</div>';
    return '<div class="card" style="padding:6px 8px">' +
      tbl('<th>Business</th><th class="num">Waiting</th><th>Last activity</th>',
        rows.map(c => '<tr><td class="name">' + esc(c.name) + '</td><td class="num warn">' +
          c.awaiting + '</td><td class="dim">' + when(c.last_event_at) + '</td></tr>')) + '</div>';
  },
  revenue(){
    const b = D.book;
    return '<div class="grid">' +
      kpi('Collected all time', money(b.collected_all_time), 'recorded payments') +
      kpi('This month', money(b.collected_this_month), 'so far') +
      kpi('Monthly recurring', money(b.mrr), b.paying + ' client(s)') +
      kpi('Still to collect', money(b.unpaid_this_month), 'fees with no payment yet',
          Number(b.unpaid_this_month) ? 'warn' : 'good') + '</div>' +
      '<section><h2>Month by month</h2><div class="card">' + chart(b.months) + '</div></section>' +
      '<section><h2>Recent payments</h2><div class="card" style="padding:6px 8px">' +
      tbl('<th>Client</th><th class="num">Amount</th><th>Paid on</th><th>Method</th><th>Reference</th>',
        (b.recent_payments || []).map(p => '<tr><td class="name">' + esc(p.name) +
          '</td><td class="num good">' + money(p.amount) + '</td><td class="dim">' +
          esc(String(p.paid_on).slice(0,10)) + '</td><td class="dim">' + esc(p.method) +
          '</td><td class="dim">' + esc(p.reference || '-') + '</td></tr>')) + '</div></section>';
  },
  clientmoney(){
    const c = (D.ops || {}).client_business || {};
    return '<div class="grid">' +
      kpi('Invoiced by clients', money(c.invoiced), (c.invoices || 0) + ' invoice(s) on the platform') +
      kpi('Collected by clients', money(c.collected), (c.payments || 0) + ' payment(s) recorded') +
      '</div><div class="sub" style="margin-top:14px">This is your clients own trade, not your ' +
      'income - it is the number that proves the platform is earning its fee. It counts only what ' +
      'has been recorded inside TechDeva; money kept in a client’s own system is not here.</div>';
  },
  invoices(){
    const b = D.book || {}, clients = b.clients || [];
    const rows = (D.invoices && D.invoices.invoices) || [];
    const options = clients.map(c => '<option value="' + esc(c.id) + '">' + esc(c.name || 'Unnamed') + '</option>').join('');
    return '<div class="grid">' +
      kpi('Invoices issued', rows.length, 'draft, sent, paid or void') +
      kpi('Awaiting payment', rows.filter(r => r.status === 'sent').length, 'sent but not yet paid') +
      '</div>' +
      '<section><h2>New invoice</h2><div class="card" style="padding:6px 8px">' +
        '<div class="row">' +
          '<select id="inv-tenant">' + options + '</select>' +
          '<input id="inv-amount" type="number" min="0" step="0.01" placeholder="Amount">' +
          '<input id="inv-currency" value="PKR" style="width:70px">' +
          '<input id="inv-desc" placeholder="Description">' +
          '<input id="inv-due" type="date">' +
          '<button class="tiny primary" id="inv-create">Create</button>' +
        '</div>' +
        '<div class="sub" style="margin-top:6px">Invoices are drafts until sent. Sending only marks status - it does not email or charge anyone.</div>' +
      '</div></section>' +
      '<section><h2>All invoices</h2><div class="card" style="padding:6px 8px">' +
        tbl('<th>Client</th><th class="num">Amount</th><th>Status</th><th>Issued</th><th>Due</th><th>Sent</th><th></th>',
          rows.map(r => '<tr><td class="name">' + esc(r.tenant_name || 'Unnamed') + '</td>' +
            '<td class="num">' + money(r.amount) + ' ' + esc(r.currency || '') + '</td>' +
            '<td><span class="pill">' + esc(r.status) + '</span></td>' +
            '<td class="dim">' + when(r.issued_on) + '</td>' +
            '<td class="dim">' + when(r.due_on) + '</td>' +
            '<td class="dim">' + when(r.sent_at) + '</td>' +
            '<td>' + (r.status === 'draft' ? '<button class="tiny" data-send="' + esc(r.id) + '">Send</button>' : '') + '</td></tr>').join('')) +
      '</div></section>';
  },
  health(){
    const h = D.health || {}, q = h.queue || {}, ai = D.ai || {};
    const dot = ok => '<span class="dot ' + (ok === true ? 'ok' : ok === false ? 'bad' : 'warn') + '"></span>';
    return '<div class="grid">' +
      kpi('Event queue', q.events != null ? q.events : '-', 'waiting to be picked up') +
      kpi('Task queue', q.tasks != null ? q.tasks : '-', 'waiting for the worker') +
      kpi('Stuck running', h.stuck_running != null ? h.stuck_running : '-', 'over 15 minutes',
          Number(h.stuck_running) ? 'bad' : 'good') +
      kpi('Tasks waiting', h.tasks_waiting != null ? h.tasks_waiting : '-', 'held behind a dependency') +
      kpi('Admin users', h.admin_users != null ? h.admin_users : '-', 'accounts that can see this page') +
      '</div>' +
      '<section><h2>Right now</h2><div class="card"><div class="health">' +
      '<div>' + dot(true) + 'API answering</div>' +
      '<div>' + dot(Number(q.tasks||0) < 50) + 'Worker draining</div>' +
      '<div>' + dot(ai.status === 'ok') + 'AI workforce ' + esc(ai.status || '?') + '</div>' +
      '<div>' + dot(!(D.inc && D.inc.open)) + ((D.inc && D.inc.open) || 0) + ' open incident(s)</div>' +
      '</div><div class="sub" style="margin-top:10px">Counted live. A red dot here is the same one ' +
      'the monitor sends to your phone.</div></div></section>';
  },
  incidents(){
    const rows = (D.inc && D.inc.incidents) || [];
    if (!rows.length) return '<div class="empty">No open incident. The monitor opens one here when ' +
      'something breaks and clears it when it recovers.</div>';
    return '<div class="card" style="padding:6px 8px">' +
      tbl('<th>Kind</th><th>Detail</th><th>Opened</th>',
        rows.map(i => '<tr><td class="name">' + esc(i.kind || i.type) + '</td><td class="dim">' +
          esc(i.detail || '') + '</td><td class="dim">' + when(i.opened_at || i.created_at) +
          '</td></tr>')) + '</div>';
  }
};

function wireClients(){
  const el = document.getElementById('view');
  el.querySelectorAll('[data-fee]').forEach(i => i.addEventListener('change', async () => {
    try { await api('/techdeva/clients/' + i.getAttribute('data-fee') + '/account',
      {method:'PUT', body: JSON.stringify({monthly_fee: i.value || 0})}); load(); }
    catch (e) { alert(e.message); }
  }));
  el.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => {
    const box = document.getElementById('pay-' + b.getAttribute('data-pay'));
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
  });
  el.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const id = b.getAttribute('data-save');
    try { await api('/techdeva/clients/' + id + '/payment', {method:'POST',
      body: JSON.stringify({amount: el.querySelector('[data-amt="' + id + '"]').value})}); load(); }
    catch (e) { alert(e.message); }
  });
  el.querySelectorAll('[data-hide]').forEach(b => b.onclick = async () => {
    if (!confirm('Hide this client from the book? Nothing is deleted.')) return;
    try { await api('/techdeva/clients/' + b.getAttribute('data-hide') + '/hide',
      {method:'POST', body: JSON.stringify({hidden:true})}); load(); }
    catch (e) { alert(e.message); }
  });
}

function wireInvoices(){
  const el = document.getElementById('view');
  const btn = document.getElementById('inv-create');
  if (btn) btn.onclick = async () => {
    const tid = document.getElementById('inv-tenant').value;
    const amount = document.getElementById('inv-amount').value;
    const currency = document.getElementById('inv-currency').value || 'PKR';
    const description = document.getElementById('inv-desc').value;
    const due_on = document.getElementById('inv-due').value || null;
    if (!tid) { alert('pick a client'); return; }
    try {
      await api('/techdeva/clients/' + tid + '/invoice', {method:'POST',
        body: JSON.stringify({amount, currency, description, due_on})});
      load();
    } catch (e) { alert(e.message); }
  };
  el.querySelectorAll('[data-send]').forEach(b => b.onclick = async () => {
    try { await api('/techdeva/invoices/' + b.getAttribute('data-send') + '/send', {method:'POST'}); load(); }
    catch (e) { alert(e.message); }
  });
}

api('/me').then(m => {
  document.getElementById('who').textContent = m.role || '';
  if (m.role === 'techdeva_admin') show();
}).catch(() => {});
</script></body></html>
