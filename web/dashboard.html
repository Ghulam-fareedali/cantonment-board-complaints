<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — TechDeva</title>
<style>
:root{
  --bg:#0A0E1A; --panel:#131A2C; --panel2:#0F1524; --line:#26324D;
  --text:#EAF1FF; --muted:#8A99B8; --accent:#6C8CFF; --tech:#4DA6F0; --growth:#34D07C;
  --warn:#E0A458; --danger:#E06A6A;
  --r:10px; --pad:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:232px;flex:0 0 232px;background:var(--panel2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:18px var(--pad);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.brand-mark{font-weight:700;letter-spacing:.06em;font-size:13px}
.brand-mark span{color:var(--tech)}
.nav{padding:12px 10px;flex:1}
.nav-group{margin-bottom:4px}
.nav-label{
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
  padding:14px 10px 6px;font-weight:600;
}
.nav a{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;
}
.nav a:hover{background:rgba(108,140,255,.08);color:var(--text)}
.nav a.active{background:rgba(108,140,255,.14);color:var(--text)}
.nav a.sub{padding-left:22px;font-size:13px}
.pill{
  font-size:10px;padding:1px 7px;border-radius:99px;background:var(--line);
  color:var(--muted);font-weight:600;
}
.pill.soon{background:transparent;border:1px solid var(--line)}
.pill.count{background:rgba(108,140,255,.2);color:var(--accent)}
.pill.attn{background:rgba(224,164,88,.18);color:var(--warn)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:14px var(--pad);
  border-bottom:1px solid var(--line);background:var(--panel2);
  position:sticky;top:0;z-index:20;
}
.burger{
  display:none;background:none;border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:6px 10px;cursor:pointer;font-size:15px;
}
.biz{min-width:0;flex:1}
.biz-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.biz-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#07101F;font-weight:600}
.content{padding:var(--pad);max-width:1180px;width:100%}
h1{font-size:19px;margin:0 0 4px;font-weight:600}
h2{font-size:14px;margin:26px 0 10px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card-value{font-size:26px;font-weight:600;margin-top:6px;font-family:'IBM Plex Mono',ui-monospace,monospace}
.card-value.none{font-size:14px;color:var(--muted);font-family:inherit;font-weight:400}
.card-note{font-size:11px;color:var(--muted);margin-top:4px}
.growth{color:var(--growth)}

/* ---------- panels / states ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-title{font-size:13px;font-weight:600}
.state{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px}
.state strong{display:block;color:var(--text);font-weight:600;margin-bottom:5px;font-size:14px}
.state.err strong{color:var(--danger)}
.spin{
  width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;padding:10px 16px;font-size:10px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;
}
td{padding:11px 16px;border-bottom:1px solid rgba(38,50,77,.5);white-space:nowrap}
tr:last-child td{border-bottom:none}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted)}

/* ---------- banner ---------- */
.banner{
  background:rgba(108,140,255,.09);border:1px solid rgba(108,140,255,.35);
  border-radius:var(--r);padding:15px 17px;margin-bottom:18px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.banner-txt{flex:1;min-width:210px}
.banner-txt strong{display:block;margin-bottom:3px}
.banner-txt span{color:var(--muted);font-size:12.5px}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:9px;max-width:300px}
.bar i{display:block;height:100%;background:var(--accent)}

/* ---------- login ---------- */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.gate-box h1{font-size:17px;margin-bottom:6px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.field input{
  width:100%;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;
}
.field input:focus{outline:none;border-color:var(--accent)}
.gate-err{color:var(--danger);font-size:12.5px;margin-bottom:10px;min-height:16px}

@media(max-width:900px){
  .sidebar{
    position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);
    transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.5);
  }
  .sidebar.open{transform:translateX(0)}
  .burger{display:block}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39;display:none}
  .scrim.on{display:block}
  :root{--pad:15px}
  .card-value{font-size:22px}
}
</style>
</head>
<body>
<div id="root"><div class="state"><span class="spin"></span>Loading your business data...</div></div>
<script>
"use strict";
/* TechDeva universal tenant dashboard.
   Rules this file obeys:
   - The tenant is decided by the backend from the signed session. Nothing here
     sends a tenant id, and nothing here would be trusted if it did.
   - No invented numbers. A metric renders only if the API actually returned it.
     Missing data says so; it never becomes a zero.
   - Every async section has loading / error / empty / success. */

var root = document.getElementById('root');
var S = { me:null, summary:null, config:null, leads:null, deliv:null, navOpen:false };

/* ---------- api ---------- */
function api(path, opts){
  opts = opts || {};
  return fetch(path, {
    method: opts.method || 'GET',
    credentials: 'include',
    headers: opts.body ? {'Content-Type':'application/json'} : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    return r.text().then(function(t){
      var d = null;
      try { d = t ? JSON.parse(t) : null; } catch(e) { d = null; }
      return { ok:r.ok, status:r.status, data:d, raw:t };
    });
  }).catch(function(e){
    return { ok:false, status:0, data:null, err:String(e) };
  });
}

/* ---------- helpers ---------- */
function esc(v){
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/* Renders a number only when one truly came back. Never turns absence into 0. */
function metric(label, value, note){
  var has = (value !== null && value !== undefined && value !== '' && !Number.isNaN(value));
  return '<div class="card"><div class="card-label">' + esc(label) + '</div>' +
    '<div class="card-value' + (has ? '' : ' none') + '">' +
    (has ? esc(value) : 'No data yet') + '</div>' +
    (note ? '<div class="card-note">' + esc(note) + '</div>' : '') + '</div>';
}
function loading(msg){ return '<div class="state"><span class="spin"></span>' + esc(msg || 'Loading your business data...') + '</div>'; }
function empty(title, msg){ return '<div class="state"><strong>' + esc(title) + '</strong>' + esc(msg || '') + '</div>'; }
function errState(msg){
  return '<div class="state err"><strong>Unable to load this information</strong>' +
    esc(msg || 'Please try again.') + '</div>';
}
function soon(what, why){
  return '<div class="state"><strong>Coming in the next module</strong>' + esc(why || (what + ' is not built yet.')) + '</div>';
}
function panel(title, inner, right){
  return '<div class="panel"><div class="panel-head"><div class="panel-title">' + esc(title) + '</div>' +
    (right || '') + '</div>' + inner + '</div>';
}
function sumCounts(obj){
  if (!obj) return null;
  var t = 0, k;
  for (k in obj) if (Object.prototype.hasOwnProperty.call(obj, k)) t += Number(obj[k]) || 0;
  return t;
}

/* ---------- nav ---------- */
var NAV = [
  { label:null, items:[ {id:'overview', name:'Overview'} ] },
  { label:'CRM', items:[
      {id:'leads', name:'Leads'},
      {id:'customers', name:'Customers', soon:true},
      {id:'appointments', name:'Appointments', soon:true},
      {id:'revenue', name:'Sales / Revenue', soon:true}
  ]},
  { label:'AI', items:[
      {id:'ai', name:'AI Workforce'},
      {id:'needshuman', name:'Needs Human', sub:true},
      {id:'inbox', name:'Inbox', soon:true}
  ]},
  { label:'Business', items:[
      {id:'integrations', name:'Integrations'},
      {id:'reports', name:'Reports'},
      {id:'settings', name:'Business Settings'}
  ]}
];

function navHTML(active){
  var out = '<div class="nav">';
  NAV.forEach(function(g){
    if (g.label) out += '<div class="nav-label">' + esc(g.label) + '</div>';
    g.items.forEach(function(it){
      var badge = '';
      if (it.soon) badge = '<span class="pill soon">Soon</span>';
      else if (it.id === 'needshuman') {
        var n = S.summary && S.summary.work_by_status ? S.summary.work_by_status.needs_human : null;
        if (n) badge = '<span class="pill attn">' + esc(n) + '</span>';
      } else if (it.id === 'leads' && S.leads && S.leads.length) {
        badge = '<span class="pill count">' + esc(S.leads.length) + '</span>';
      }
      out += '<a href="#/' + it.id + '" class="' + (active === it.id ? 'active' : '') +
             (it.sub ? ' sub' : '') + '">' + esc(it.name) + badge + '</a>';
    });
  });
  return out + '</div>';
}

/* ---------- business identity (from the backend record, never hard-coded) ---------- */
function bizIdentity(){
  var t = (S.summary && S.summary.trial) || {};
  var name = t.name;
  var setup = !name;
  var bits = [];
  if (t.industry) bits.push(t.industry);
  if (t.plan) bits.push(t.plan);
  if (t.status) bits.push(t.status);
  if (typeof t.days_left === 'number') bits.push(t.days_left + ' days left in trial');
  return {
    name: setup ? 'Complete your business setup' : name,
    sub: setup ? 'Your business name has not been set yet' : bits.join(' · '),
    setup: setup
  };
}

/* ---------- views ---------- */
var VIEWS = {};

VIEWS.overview = function(){
  var s = S.summary, out = '';
  var id = bizIdentity();
  out += '<h1>Overview</h1><p class="sub">Live figures for ' + esc(id.setup ? 'your business' : id.name) + '.</p>';

  var ob = S.config && S.config.onboarding;
  if (ob && ob.percent < 100) {
    out += '<div class="banner"><div class="banner-txt"><strong>Complete your business setup</strong>' +
      '<span>' + esc(ob.complete) + ' of ' + esc(ob.total) + ' steps done' +
      (ob.missing && ob.missing.length ? ' — next: ' + esc(ob.missing[0].label) : '') + '</span>' +
      '<div class="bar"><i style="width:' + esc(ob.percent) + '%"></i></div></div>' +
      '<a class="btn primary" href="/onboarding">Continue setup</a></div>';
  }

  if (!s) return out + errState('The summary service did not respond.');

  var work = s.work_by_status || null;
  var dlv  = s.deliverables_by_status || null;
  var integ = s.integrations || null;
  var connected = integ ? Object.keys(integ).filter(function(k){
    return String(integ[k]).toLowerCase() === 'connected';
  }).length : null;

  out += '<div class="grid">';
  out += metric('Leads', S.leads ? S.leads.length : null, S.leads ? 'Most recent first' : 'Could not load leads');
  out += metric('AI tasks', work ? sumCounts(work) : null, work ? 'All statuses' : null);
  out += metric('Needs your approval', work ? (work.needs_human || 0) : null, 'Human decisions pending');
  out += metric('AI deliverables', dlv ? sumCounts(dlv) : null);
  out += metric('Analysis runs', typeof s.analysis_runs === 'number' ? s.analysis_runs : null);
  out += metric('Integrations connected', connected, integ ? Object.keys(integ).length + ' configured' : null);
  out += '</div>';

  out += '<h2>Not measured yet</h2>';
  out += panel('Revenue, customers and appointments',
    soon('', 'These need the business and money tables, which arrive in a later module. Nothing is estimated here in the meantime.'));
  return out;
};

VIEWS.leads = function(){
  var out = '<h1>Leads</h1><p class="sub">Every lead belonging to this business.</p>';
  if (S.leads === null) return out + panel('Leads', errState('The leads service did not respond.'));
  if (!S.leads.length) return out + panel('Leads', empty('No leads yet', 'Leads will appear here as they arrive.'));
  var rows = S.leads.map(function(l){
    return '<tr><td>' + esc(l.name || '—') + '</td><td>' + esc(l.phone || '—') + '</td>' +
      '<td>' + esc(l.service || '—') + '</td>' +
      '<td><span class="tag">' + esc(l.status || 'new') + '</span></td>' +
      '<td>' + esc(l.source || '—') + '</td>' +
      '<td>' + esc(l.priority === null || l.priority === undefined ? '—' : l.priority) + '</td></tr>';
  }).join('');
  return out + panel('Leads',
    '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Service</th>' +
    '<th>Status</th><th>Source</th><th>Priority</th></tr></thead><tbody>' + rows + '</tbody></table></div>',
    '<span class="pill count">' + S.leads.length + '</span>');
};

VIEWS.customers = function(){
  return '<h1>Customers</h1><p class="sub">Repeat clients, history and notes.</p>' +
    panel('Customers', soon('', 'There is no customers table in the platform yet. It is built in the next module, together with services, prices and staff.'));
};
VIEWS.appointments = function(){
  return '<h1>Appointments</h1><p class="sub">Bookings and the calendar.</p>' +
    panel('Appointments', soon('', 'The appointments table exists in the database but has no API route yet. It is wired up in the next module.'));
};
VIEWS.revenue = function(){
  return '<h1>Sales / Revenue</h1><p class="sub">Invoices, payments and takings.</p>' +
    panel('Sales and revenue', soon('', 'Revenue can currently only be recorded, not read back — there is no read endpoint yet, and no invoices or payments tables. Rather than show a partial number, this stays empty until the finance module lands.'));
};
VIEWS.inbox = function(){
  return '<h1>Inbox</h1><p class="sub">WhatsApp, Instagram, Messenger, email and website leads in one place.</p>' +
    panel('Conversations', soon('', 'The conversations and messages tables exist but have no API route, and the WhatsApp connection is still being repaired. Nothing is shown until real messages can be read.'));
};

VIEWS.ai = function(){
  var out = '<h1>AI Workforce</h1><p class="sub">What your AI employees have done for this business.</p>';
  var s = S.summary;
  if (!s) return out + errState('The summary service did not respond.');
  var work = s.work_by_status;
  if (!work || !sumCounts(work)) {
    out += panel('Tasks', empty('No AI activity yet', 'Work will appear here once agents start running for this business.'));
  } else {
    out += '<div class="grid">';
    out += metric('Waiting', work.waiting);
    out += metric('Running', work.running);
    out += metric('Done', work.done);
    out += metric('Needs human', work.needs_human);
    out += metric('Failed', work.dead || work.failed);
    out += '</div>';
  }
  out += '<h2>Deliverables</h2>';
  if (S.deliv === null) out += panel('AI deliverables', errState('The deliverables service did not respond.'));
  else if (!S.deliv.length) out += panel('AI deliverables', empty('Nothing produced yet', 'Finished AI work will appear here for your approval.'));
  else {
    var rows = S.deliv.map(function(d){
      return '<tr><td>' + esc(d.kind || d.type || '—') + '</td>' +
        '<td><span class="tag">' + esc(d.status || '—') + '</span></td>' +
        '<td>' + esc(d.title || d.summary || '—') + '</td></tr>';
    }).join('');
    out += panel('AI deliverables',
      '<div class="tbl-wrap"><table><thead><tr><th>Kind</th><th>Status</th><th>Detail</th></tr></thead><tbody>' +
      rows + '</tbody></table></div>');
  }
  return out;
};

VIEWS.needshuman = function(){
  var out = '<h1>Needs Human</h1><p class="sub">Work the AI has paused for your decision.</p>';
  var n = S.summary && S.summary.work_by_status ? S.summary.work_by_status.needs_human : null;
  var note = n ? '<div class="banner"><div class="banner-txt"><strong>' + esc(n) +
    ' task' + (n === 1 ? '' : 's') + ' waiting on you</strong><span>These belong to this business only.</span></div></div>' : '';
  return out + note + panel('Human review centre',
    soon('', 'The review and approval screen arrives in the next module. Until then the count above is real, but the tasks cannot be actioned here.'));
};

VIEWS.integrations = function(){
  var out = '<h1>Integrations</h1><p class="sub">What this business is actually connected to. A channel is shown as connected only when a credential is stored for it.</p>';
  out += panel('Channels', '<div id="intg">' + loading('Checking each channel...') + '</div>');
  out += '<h2>Connecting a channel</h2>';
  out += panel('Connect', soon('', 'The connect flow - including WhatsApp pairing - is built in a later module, once the Hermes link is verified end to end. No QR code is shown until it genuinely works.'));
  api('/integrations').then(function(r){
    var el = document.getElementById('intg');
    if (!el) return;
    if (!r.ok) { el.innerHTML = errState('The integration service returned ' + r.status + '.'); return; }
    var items = (r.data && r.data.integrations) || [];
    if (!items.length) { el.innerHTML = empty('No channels', 'Nothing has been set up for this business yet.'); return; }
    // Wording is deliberate: "never connected" is not the same as "disconnected",
    // and the dashboard used to show four channels as live that had never been set up.
    var WORDS = {
      never_connected: ['Never connected', 'var(--muted)'],
      connecting:      ['Connecting',      'var(--muted)'],
      connected:       ['Connected',       'var(--growth)'],
      expired:         ['Needs re-auth',   'var(--warn)'],
      error:           ['Failing',         'var(--danger)'],
      disconnected:    ['Disconnected',    'var(--muted)']
    };
    el.innerHTML = '<div class="tbl-wrap"><table><thead><tr><th>Channel</th><th>Status</th><th>Account</th><th>Since</th></tr></thead><tbody>' +
      items.map(function(i){
        var w = WORDS[i.status] || [i.status, 'var(--muted)'];
        var since = i.connected_at ? esc(String(i.connected_at).slice(0, 10)) : '-';
        return '<tr><td>' + esc(i.provider) + '</td>' +
               '<td><span class="tag" style="color:' + w[1] + '">' + esc(w[0]) + '</span></td>' +
               '<td>' + esc(i.external_account || '-') + '</td>' +
               '<td>' + since + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  });
  return out;
};

VIEWS.reports = function(){
  var out = '<h1>Reports</h1><p class="sub">Analysis produced for this business.</p>';
  out += panel('Latest report', '<div id="rep">' + loading('Loading your report...') + '</div>');
  api('/portal/report').then(function(r){
    var el = document.getElementById('rep');
    if (!el) return;
    if (!r.ok) { el.innerHTML = errState('The report service returned ' + r.status + '.'); return; }
    var d = r.data || {};
    if (d.status === 'pending' || !d || Object.keys(d).length === 0) {
      el.innerHTML = empty('Nothing to show yet', d.message || 'Your analysis has not produced a report yet.');
      return;
    }
    el.innerHTML = '<div style="padding:16px"><pre class="mono" style="white-space:pre-wrap;margin:0;font-size:12px;color:var(--muted)">' +
      esc(JSON.stringify(d, null, 2)) + '</pre></div>';
  });
  return out;
};

VIEWS.settings = function(){
  var out = '<h1>Business Settings</h1><p class="sub">The information your AI workforce uses to represent this business.</p>';
  var cfg = S.config;
  if (!cfg) return out + panel('Business settings', errState('The settings service did not respond.'));
  var ob = cfg.onboarding || {};
  var c = cfg.config || {};
  var rows = (ob.done || []).map(function(s){
    return '<tr><td>' + esc(s.label) + '</td><td><span class="tag" style="color:var(--growth)">Provided</span></td></tr>';
  }).concat((ob.missing || []).map(function(s){
    return '<tr><td>' + esc(s.label) + '</td><td><span class="tag">Not set</span></td></tr>';
  })).join('');
  out += panel('Business Brain — ' + (ob.percent || 0) + '% complete',
    '<div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="2">No setup steps defined.</td></tr>') + '</tbody></table></div>',
    '<a class="btn" href="/onboarding">Edit</a>');

/* Lazily fetch a section's data the first time it is opened, instead of
   loading everything on boot. null means "tried and failed" so the view can
   tell an error apart from an empty business. */
var LOADING = {};
function need(key, path, force){
  if (force) { S[key] = undefined; LOADING[key] = false; }
  if (S[key] !== undefined) return true;
  if (LOADING[key]) return false;
  LOADING[key] = true;
  api(path).then(function(r){
    LOADING[key] = false;
    S[key] = r.ok ? r.data : null;
    renderShell();
  });
  return false;
}
function act(path, opts, msg){
  var el = document.getElementById('actmsg');
  if (el) el.textContent = 'Working...';
  return api(path, opts).then(function(r){
    if (el) {
      el.textContent = r.ok ? (msg || 'Saved.')
        : ((r.data && (r.data.detail || r.data.message)) || 'That did not work.');
      el.style.color = r.ok ? 'var(--growth)' : 'var(--danger)';
    }
    return r;
  });
}
function actbar(){ return '<div id="actmsg" class="card-note" style="min-height:18px;margin:10px 0"></div>'; }
function money(v, cur){
  if (v === null || v === undefined || v === '') return '—';
  var n = Number(v);
  if (Number.isNaN(n)) return esc(v);
  return esc((cur || 'PKR') + ' ' + n.toLocaleString());
}

function wireSettings(sec){
  Array.prototype.forEach.call(document.querySelectorAll('.biztab'), function(b){
    b.onclick = function(){ BIZ_TAB = b.getAttribute('data-tab'); renderShell(); };
  });

  var add = document.getElementById('bizadd');
  if (add) add.onclick = function(){
    var body = {}, msg = document.getElementById('actmsg');
    Array.prototype.forEach.call(document.querySelectorAll('.bizf'), function(f){
      var v = f.value.trim();
      if (!v) return;
      if (f.getAttribute('data-f') === 'price' || f.getAttribute('data-f') === 'target') v = Number(v);
      else if (f.getAttribute('data-f') === 'duration_minutes' || f.getAttribute('data-f') === 'day_of_week') v = parseInt(v, 10);
      body[f.getAttribute('data-f')] = v;
    });
    var missing = sec.req.filter(function(r){
      return body[r] === undefined || body[r] === '' || (typeof body[r] === 'number' && Number.isNaN(body[r]));
    });
    if (missing.length) { msg.textContent = missing.join(' and ') + ' required.'; msg.style.color = 'var(--danger)'; return; }
    act('/business/' + sec.key, {method:'POST', body:body}, 'Saved.').then(function(r){
      if (r.ok) need('biz_' + sec.key, '/business/' + sec.key, true);
    });
  };

  Array.prototype.forEach.call(document.querySelectorAll('.bizdel'), function(b){
    b.onclick = function(){
      b.disabled = true;
      act('/business/' + sec.key + '/' + b.getAttribute('data-id'), {method:'DELETE'}, 'Removed.')
        .then(function(r){ if (r.ok) need('biz_' + sec.key, '/business/' + sec.key, true); else b.disabled = false; });
    };
  });

  var parse = document.getElementById('parsebtn');
  if (parse) parse.onclick = function(){
    var box = document.getElementById('pastebox'), out = document.getElementById('proposals');
    out.innerHTML = loading('Reading...');
    api('/brain/extract', {method:'POST', body:{text: box.value}}).then(function(r){
      if (!r.ok) {
        out.innerHTML = errState((r.data && r.data.detail) || 'Could not read that.');
        return;
      }
      var p = r.data.proposals || [];
      if (!p.length) {
        out.innerHTML = empty('Nothing recognised',
          'Try one service per line, like "Full Face - 15,000".');
        return;
      }
      var html = '<div style="margin-top:14px"><div class="card-note" style="margin-bottom:6px">' +
        'Found ' + p.length + '. Nothing is saved yet — uncheck anything wrong, then confirm.' +
        (r.data.counts.not_understood ? ' ' + r.data.counts.not_understood + ' line(s) were not understood and were skipped.' : '') +
        '</div>';
      p.forEach(function(x, i){
        html += '<label class="prop"><input type="checkbox" class="propchk" checked data-i="' + i + '">' +
          '<span style="flex:1;min-width:140px">' + esc(x.name) + '</span>' +
          '<span class="mono growth">' + money(x.price, x.currency) + '</span>' +
          (x.duration_minutes ? '<span class="tag">' + esc(x.duration_minutes) + ' min</span>' : '') +
          (x.category ? '<span class="tag">' + esc(x.category) + '</span>' : '') + '</label>';
      });
      html += '<div style="margin-top:12px"><button class="btn primary" id="confirmprops">Save selected</button>' +
              '<span id="propmsg" class="card-note" style="margin-left:10px"></span></div></div>';
      out.innerHTML = html;
      document.getElementById('confirmprops').onclick = function(){
        var chosen = [];
        Array.prototype.forEach.call(document.querySelectorAll('.propchk'), function(c){
          if (c.checked) chosen.push(p[parseInt(c.getAttribute('data-i'), 10)]);
        });
        var m = document.getElementById('propmsg');
        if (!chosen.length) { m.textContent = 'Nothing selected.'; return; }
        m.textContent = 'Saving ' + chosen.length + '...';
        var done = 0, failed = 0;
        chosen.forEach(function(x){
          api('/business/services', {method:'POST', body:{
            name: x.name, price: x.price, currency: x.currency,
            duration_minutes: x.duration_minutes, category: x.category
          }}).then(function(r2){
            if (r2.ok) done++; else failed++;
            if (done + failed === chosen.length) {
              m.textContent = done + ' saved' + (failed ? ', ' + failed + ' failed (duplicate names are refused)' : '') + '.';
              m.style.color = failed ? 'var(--warn)' : 'var(--growth)';
              need('biz_services', '/business/services', true);
            }
          });
        });
      };
    });
  };

  var pub = document.getElementById('pubbtn');
  if (pub) pub.onclick = function(){
    var o = document.getElementById('pubout');
    o.textContent = 'Publishing...';
    api('/brain/publish', {method:'POST', body:{}}).then(function(r){
      if (!r.ok) {
        o.textContent = (r.data && r.data.detail) || 'Could not publish.';
        o.style.color = 'var(--danger)';
        return;
      }
      var w = r.data.written || [];
      o.innerHTML = '<span style="color:var(--growth)">' + esc(r.data.message || 'Published.') + '</span>' +
        (w.length ? '<br>Updated: ' + esc(w.join(', ')) : '') +
        ((r.data.skipped || []).length ? '<br>Left alone: ' + esc(r.data.skipped.join('; ')) : '');
    });
  };
}

    select('apcust', (S.customers && S.customers.items) || [], 'Customer (optional)') +
    select('apsvc', (S.services && S.services.items) || [], 'Service (optional)') +

    inp('apnotes', 'Notes', 'text', 160) +
    '<button class="btn primary" id="apadd">Book</button></div>' + actbar();

  var rows = S[key].appointments || [];
  if (!rows.length) {
    out += panel('Appointments', empty('Nothing here yet',
      APPT_WHEN === 'upcoming' ? 'Book one above and it appears here.' : 'No past appointments recorded.'));
  } else {
    var body = rows.map(function(a){
      return '<tr><td>' + when(a.starts_at) + '</td>' +
        '<td>' + esc(a.customer_name || '—') + '<div class="card-note">' + esc(a.customer_phone || '') + '</div></td>' +
        '<td>' + esc(a.service_name || a.service_text || '—') + '</td>' +
        '<td>' + esc(a.staff_name || '—') + '</td>' +
        '<td><span class="tag">' + esc(a.status || '—') + '</span></td>' +
        '<td>' + money(a.price, a.currency) + '</td></tr>';
    }).join('');
    out += panel('Appointments',
      '<div class="tbl-wrap"><table><thead><tr><th>When</th><th>Customer</th><th>Service</th>' +
      '<th>Staff</th><th>Status</th><th>Price</th></tr></thead><tbody>' + body + '</tbody></table></div>',
      '<span class="pill count">' + rows.length + '</span>');
  }

  setTimeout(function(){
    document.querySelectorAll('[data-when]').forEach(function(b){
      b.onclick = function(){ APPT_WHEN = b.getAttribute('data-when'); renderShell(); };
    });
    var add = document.getElementById('apadd');
    if (!add) return;
    add.onclick = function(){
      var starts = val('apstart');
      if (!starts) { say('An appointment needs a start time.'); return; }
      act('/business/appointments', {method:'POST', body:{
        customer_id: val('apcust') || null,
        service_id: val('apsvc') || null,
        staff_id: val('apstaff') || null,
        starts_at: starts,
        price: numv('apprice'),
        notes: val('apnotes') || null
      }}, 'Appointment booked.').then(function(r){
        if (r.ok) need(key, '/operations/appointments?when=' + APPT_WHEN, true);
      });
    };
  }, 0);
  return out;
};

var NEW_LINES = [];
var OPEN_INVOICE = null;

function lineTotal(l){ return Math.round(Number(l.quantity) * Number(l.unit_price) * 100) / 100; }

VIEWS.invoices = function(){
  var out = '<h1>Money / Invoices</h1><p class="sub">What was billed, what was collected, what is still owed.</p>';
  if (!need('invoices', '/business/invoices'))
    return out + panel('Invoices', loading('Loading invoices...'));
  if (S.invoices === null)
    return out + panel('Invoices', errState('The invoice service did not respond.'));
  need('customers', '/business/customers');
  need('services', '/business/services');
  need('products', '/business/products');

  var svcs = (S.services && S.services.items) || [];
  var prods = (S.products && S.products.items) || [];
  var catalogue = svcs.map(function(s){ return {id:'s:' + s.id, name:s.name, price:s.price}; })
    .concat(prods.map(function(p){ return {id:'p:' + p.id, name:p.name, price:p.price}; }));

  out += '<h2>New invoice</h2>';
  out += row() +
    select('invcust', (S.customers && S.customers.items) || [], 'Customer (optional)') +
    inp('invdisc', 'Discount', 'number', 110) +
    inp('invtax', 'Tax', 'number', 110) +
    '</div>';
  out += row() +
    select('invitem', catalogue, 'Pick a service or product') +
    inp('invqty', 'Qty', 'number', 80) +
    inp('invprice', 'Unit price', 'number', 120) +
    '<button class="btn" id="invaddline">Add line</button></div>';

  if (NEW_LINES.length) {
    var sub = 0;
    var lines = NEW_LINES.map(function(l, i){
      sub += lineTotal(l);
      return '<tr><td>' + esc(l.description) + '</td><td>' + esc(l.quantity) + '</td><td>' +
        money(l.unit_price) + '</td><td>' + money(lineTotal(l)) + '</td>' +
        '<td><button class="btn" data-rmline="' + i + '">Remove</button></td></tr>';
    }).join('');
    out += panel('Draft lines',
      '<div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Line</th><th></th></tr></thead>' +
      '<tbody>' + lines + '</tbody></table></div>' +
      '<div class="card-note" style="margin-top:8px">Lines total ' + money(sub) +
      ' before discount and tax. The server recalculates this and its number is the one that counts.</div>' +
      '<div style="margin-top:10px"><button class="btn primary" id="invcreate">Create invoice</button></div>');
  } else {
    out += panel('Draft lines', empty('No lines yet', 'Add at least one line before creating the invoice.'));
  }
  out += actbar();

  var items = (S.invoices && S.invoices.items) || [];
  if (!items.length) {
    out += '<h2>All invoices</h2>' + panel('Invoices', empty('No invoices yet', 'Create one above.'));
  } else {
    var body = items.map(function(v){
      return '<tr><td><strong>' + esc(v.number || '—') + '</strong></td>' +
        '<td>' + onlyDate(v.issued_on) + '</td>' +
        '<td><span class="tag">' + esc(v.status || '—') + '</span></td>' +
        '<td>' + money(v.total, v.currency) + '</td>' +
        '<td><button class="btn" data-open="' + esc(v.id) + '">' +
        (OPEN_INVOICE === v.id ? 'Close' : 'Open') + '</button></td></tr>';
    }).join('');
    out += '<h2>All invoices</h2>' + panel('Invoices',
      '<div class="tbl-wrap"><table><thead><tr><th>Number</th><th>Issued</th><th>Status</th>' +
      '<th>Total</th><th></th></tr></thead><tbody>' + body + '</tbody></table></div>',
      '<span class="pill count">' + items.length + '</span>');
  }

  if (OPEN_INVOICE) {
    var dk = 'inv_' + OPEN_INVOICE;
    if (!need(dk, '/operations/invoices/' + OPEN_INVOICE)) {
      out += panel('Invoice', loading('Opening invoice...'));
    } else if (S[dk] === null) {
      out += panel('Invoice', errState('That invoice could not be read.'));
    } else {
      var d = S[dk], iv = d.invoice;
      var il = (d.items || []).map(function(l){
        return '<tr><td>' + esc(l.description) + '</td><td>' + esc(l.quantity) + '</td><td>' +
          money(l.unit_price, iv.currency) + '</td><td>' + money(l.line_total, iv.currency) + '</td></tr>';
      }).join('');
      var pl = (d.payments || []).length
        ? (d.payments).map(function(p){
            return '<tr><td>' + when(p.paid_at) + '</td><td>' + money(p.amount, p.currency) +
              '</td><td><span class="tag">' + esc(p.method) + '</span></td><td>' +
              esc(p.reference || '—') + '</td></tr>';
          }).join('')
        : '<tr><td colspan="4" class="card-note">Nothing paid yet.</td></tr>';
      var detail =
        '<div class="grid">' +
        metric('Total', money(iv.total, iv.currency)) +
        metric('Paid', money(d.paid, iv.currency)) +
        metric('Balance', money(d.balance, iv.currency),
               d.balance > 0 ? 'Still owed' : 'Settled') +
        '</div>' +
        '<h3>Lines</h3><div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Qty</th>' +
        '<th>Unit</th><th>Line</th></tr></thead><tbody>' + il + '</tbody></table></div>' +
        '<h3>Payments</h3><div class="tbl-wrap"><table><thead><tr><th>When</th><th>Amount</th>' +
        '<th>Method</th><th>Reference</th></tr></thead><tbody>' + pl + '</tbody></table></div>';
      if (iv.status !== 'void' && d.balance > 0) {
        detail += '<h3>Take a payment</h3>' + row() +
          inp('payamt', 'Amount', 'number', 120) +
          '<select class="fld" id="paymethod" style="flex:1;min-width:120px">' +
          '<option value="cash">Cash</option><option value="card">Card</option>' +
          '<option value="bank">Bank</option><option value="online">Online</option>' +
          '<option value="other">Other</option></select>' +
          inp('payref', 'Reference (optional)', 'text', 150) +
          '<button class="btn primary" id="paybtn">Record payment</button></div>';
      }
      if (iv.status !== 'void' && Number(d.paid) === 0) {
        detail += '<h3>Void</h3>' + row() +
          inp('voidreason', 'Why is this being voided?', 'text', 240) +
          '<button class="btn" id="voidbtn">Void invoice</button></div>' +
          '<div class="card-note">Voiding keeps the invoice and its history. Nothing is deleted.</div>';
      }
      out += panel('Invoice ' + esc(iv.number || ''), detail + actbar(),
        '<span class="tag">' + esc(iv.status) + '</span>');
    }
  }

  setTimeout(function(){
    document.querySelectorAll('[data-open]').forEach(function(b){
      b.onclick = function(){
        var id = b.getAttribute('data-open');
        OPEN_INVOICE = (OPEN_INVOICE === id) ? null : id;
        renderShell();
      };
    });
    document.querySelectorAll('[data-rmline]').forEach(function(b){
      b.onclick = function(){
        NEW_LINES.splice(Number(b.getAttribute('data-rmline')), 1);
        renderShell();
      };
    });
    var pick = document.getElementById('invitem');
    if (pick) pick.onchange = function(){
      var hit = null;
      catalogue.forEach(function(c){ if (c.id === pick.value) hit = c; });
      var pf = document.getElementById('invprice');
      if (hit && pf && hit.price !== null && hit.price !== undefined) pf.value = hit.price;
    };
    var addl = document.getElementById('invaddline');
    if (addl) addl.onclick = function(){
      var sel = val('invitem');
      var qty = numv('invqty') || 1;
      var price = numv('invprice');
      if (price === null) { say('A line needs a unit price.'); return; }
      var label = '';
      catalogue.forEach(function(c){ if (c.id === sel) label = c.name; });
      if (!label) { say('Pick a service or product for this line.'); return; }
      var line = {description: label, quantity: qty, unit_price: price};
      if (sel.indexOf('s:') === 0) line.service_id = sel.slice(2);
      if (sel.indexOf('p:') === 0) line.product_id = sel.slice(2);
      NEW_LINES.push(line);
      renderShell();
    };
    var mk = document.getElementById('invcreate');
    if (mk) mk.onclick = function(){
      act('/operations/invoices', {method:'POST', body:{
        customer_id: val('invcust') || null,
        items: NEW_LINES,
        discount: numv('invdisc') || 0,
        tax: numv('invtax') || 0
      }}, 'Invoice created.').then(function(r){
        if (r.ok) { NEW_LINES = []; OPEN_INVOICE = r.data.invoice_id; need('invoices', '/business/invoices', true); }
      });
    };
    var pay = document.getElementById('paybtn');
    if (pay) pay.onclick = function(){
      var amt = numv('payamt');
      if (amt === null || !(amt > 0)) { say('Enter the amount received.'); return; }
      act('/operations/invoices/' + OPEN_INVOICE + '/pay', {method:'POST', body:{
        amount: amt, method: val('paymethod') || 'cash', reference: val('payref') || null
      }}, 'Payment recorded.').then(function(r){
        if (r.ok) { need('inv_' + OPEN_INVOICE, '/operations/invoices/' + OPEN_INVOICE, true);
                    need('invoices', '/business/invoices', true); }
      });
    };
    var vd = document.getElementById('voidbtn');
    if (vd) vd.onclick = function(){
      var reason = val('voidreason');
      if (reason.length < 3) { say('A void needs a written reason.'); return; }
      act('/operations/invoices/' + OPEN_INVOICE + '/void', {method:'POST', body:{reason: reason}},
          'Invoice voided.').then(function(r){
        if (r.ok) { need('inv_' + OPEN_INVOICE, '/operations/invoices/' + OPEN_INVOICE, true);
                    need('invoices', '/business/invoices', true); }
      });
    };
  }, 0);
  return out;
};

};

VIEWS.dayclose = function(){
  var out = '<h1>Money / Day Close</h1>' +
    '<p class="sub">Count the drawer, compare it with the books, and record the difference.</p>';
  if (!need('closing', '/operations/closing/preview'))
    return out + panel('Day close', loading('Working out what today should hold...'));
  if (S.closing === null)
    return out + panel('Day close', errState('The closing service did not respond.'));
  var c = S.closing, bm = c.by_method || {};

  out += '<div class="grid">' +
    metric('Expected in total', money(c.expected_total), 'From payments recorded today') +
    metric('Cash expected', money(bm.cash || 0)) +
    metric('Card expected', money(bm.card || 0)) +
    metric('Expenses today', money(c.expenses_total)) +
    '</div>';

  if (c.already_closed) {
    out += panel('Today is closed',
      '<div class="grid">' +
      metric('Counted', money(c.already_closed.counted_total)) +
      metric('Variance', money(c.already_closed.variance),
             Number(c.already_closed.variance) === 0 ? 'Balanced' : 'Difference recorded') +
      metric('Closed at', when(c.already_closed.closed_at)) +
      '</div><div class="card-note">A closed day stays as it was closed. Corrections are recorded as new entries, not by rewriting this one.</div>');
    return out;
  }

  out += '<h2>Count the drawer</h2>' + row() +
    inp('ccash', 'Cash counted', 'number', 130) +
    inp('ccard', 'Card counted', 'number', 130) +
    inp('cbank', 'Bank counted', 'number', 130) +
    inp('cother', 'Other', 'number', 110) +
    '</div>' + row() +
    inp('cnotes', 'Notes (optional)', 'text', 240) +
    '<button class="btn primary" id="closebtn">Close the day</button></div>' + actbar() +
    '<div class="card-note">The difference between what you counted and what the books expect is saved as the variance. It is not hidden and it is not rounded away.</div>';

  setTimeout(function(){
    var b = document.getElementById('closebtn');
    if (!b) return;
    b.onclick = function(){
      act('/operations/closing', {method:'POST', body:{
        cash_counted: numv('ccash') || 0,
        card_counted: numv('ccard') || 0,
        bank_counted: numv('cbank') || 0,
        other_counted: numv('cother') || 0,
        notes: val('cnotes') || null
      }}, 'Day closed.').then(function(r){
        if (r.ok) need('closing', '/operations/closing/preview', true);
      });
    };
  }, 0);
  return out;
};

VIEWS.inventory = function(){
  var out = '<h1>Catalogue / Inventory</h1>' +
    '<p class="sub">Stock on hand, added up from every movement rather than stored as a number someone can edit.</p>';
  if (!need('inventory', '/operations/inventory'))
    return out + panel('Inventory', loading('Counting stock...'));

      '<div class="tbl-wrap"><table><thead><tr><th>Product</th><th>On hand</th>' +
      '<th>Threshold</th></tr></thead><tbody>' + inv.low_stock.map(function(p){
        return '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.on_hand) + '</td><td>' +
          esc(p.low_stock_threshold) + '</td></tr>';
      }).join('') + '</tbody></table></div>');
  }

  out += '<h2>Record a stock movement</h2>' + row() +
    select('stprod', prods, 'Product') +
    '<select class="fld" id="stkind" style="flex:1;min-width:140px">' +
    '<option value="purchase">Purchase in</option><option value="sale">Sale out</option>' +
    '<option value="adjustment">Adjustment</option><option value="return">Return</option>' +
    '<option value="opening">Opening balance</option></select>' +
    inp('stqty', 'Quantity (+ in, - out)', 'number', 160) +
    inp('streason', 'Reason', 'text', 150) +
    '<button class="btn primary" id="stadd">Record</button></div>' + actbar();

  out += panel('Stock on hand', prods.length
    ? '<div class="tbl-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Tracked</th>' +
      '<th>On hand</th><th>Last movement</th></tr></thead><tbody>' + prods.map(function(p){
        return '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.sku || '—') + '</td>' +
          '<td>' + (p.track_stock ? '<span class="tag">yes</span>' : '—') + '</td>' +
          '<td>' + (p.track_stock ? esc(p.on_hand) : '—') + '</td>' +
          '<td>' + when(p.last_movement) + '</td></tr>';
      }).join('') + '</tbody></table></div>'
    : empty('No products yet', 'Add products in the catalogue first.'),
    '<span class="pill count">' + prods.length + '</span>');

  setTimeout(function(){
    var b = document.getElementById('stadd');
    if (!b) return;
    b.onclick = function(){
      var pid = val('stprod'), q = numv('stqty');
      if (!pid) { say('Pick a product.'); return; }
      if (q === null || q === 0) { say('A movement needs a non-zero quantity.'); return; }
      act('/business/stock_movements', {method:'POST', body:{
        product_id: pid, kind: val('stkind') || 'adjustment',
        quantity_delta: q, reason: val('streason') || null
      }}, 'Movement recorded.').then(function(r){
        if (r.ok) need('inventory', '/operations/inventory', true);
      });
    };
  }, 0);
  return out;
};


/* ---------- Part 3: Reports the owner can actually read ----------
   The previous version printed the analysis JSON. This one answers the
   questions an owner asks at the end of a month, and keeps the raw analysis
   available underneath rather than in place of an answer. */

var RANGE = 'month';

function rangeDates(which){
  var now = new Date(), start, end = new Date();
  if (which === 'last30') { start = new Date(now.getTime() - 29 * 86400000); }
  else if (which === 'year') { start = new Date(now.getFullYear(), 0, 1); }
  else { start = new Date(now.getFullYear(), now.getMonth(), 1); }
  var iso = function(d){ return d.toISOString().slice(0, 10); };
  return {start: iso(start), end: iso(end)};
}

function inRange(ts, r){
  if (!ts) return false;
  var d = String(ts).slice(0, 10);
  return d >= r.start && d <= r.end;
}

VIEWS.reports = function(){
  var r = rangeDates(RANGE);
  var out = '<h1>Reports</h1><p class="sub">What the business did, and what your AI team found.</p>';

  var tabs = [['month', 'This month'], ['last30', 'Last 30 days'], ['year', 'This year']]
    .map(function(t){
      return '<button class="btn' + (RANGE === t[0] ? ' primary' : '') +
             '" data-range="' + t[0] + '">' + t[1] + '</button>';
    }).join(' ');
  out += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">' + tabs +
         '<button class="btn" id="printrep">Print or save as PDF</button></div>';

  var key = 'pnl_' + RANGE;
  if (!need(key, '/operations/pnl?start=' + r.start + '&end=' + r.end))
    return out + panel('Business performance', loading('Adding up the period...'));
  if (S[key] === null)
    return out + panel('Business performance', errState('The reporting service did not respond.'));
  need('appointments_all', '/operations/appointments?when=all');
  need('customers', '/business/customers');

  var p = S[key];
  out += '<div class="card-note">' + esc(r.start) + ' to ' + esc(r.end) + '</div>';
  out += '<h2>Money</h2><div class="grid">' +
    metric('Collected', money(p.collected), p.payment_count + ' payments') +
    metric('Invoiced', money(p.invoiced), p.invoice_count + ' invoices') +
    metric('Expenses', money(p.expenses)) +
    metric('Net', money(p.net), 'Collected less expenses') +
    metric('Still owed', money(p.outstanding_all_time), 'All time, unpaid invoices') +
    '</div>';

  var appts = (S.appointments_all && S.appointments_all.appointments) || [];
  var custs = (S.customers && S.customers.items) || [];
  var booked = appts.filter(function(a){ return inRange(a.starts_at, r); });
  var newCust = custs.filter(function(c){ return inRange(c.created_at || c.first_seen_at, r); });
  out += '<h2>Activity</h2><div class="grid">' +
    metric('Appointments in period', booked.length) +
    metric('New customers', newCust.length) +
    metric('Customers on file', custs.length) +
    '</div>';

  var bc = p.expenses_by_category || [];
  out += panel('Where the money went', bc.length
    ? '<div class="tbl-wrap"><table><thead><tr><th>Category</th><th>Amount</th></tr></thead><tbody>' +
      bc.map(function(x){ return '<tr><td>' + esc(x.category) + '</td><td>' + money(x.amount) + '</td></tr>'; }).join('') +
      '</tbody></table></div>'
    : empty('No expenses in this period', 'Record expenses to see them broken down here.'));

  var bm = p.collected_by_method || [];
  if (bm.length) {
    out += panel('How customers paid',
      '<div class="tbl-wrap"><table><thead><tr><th>Method</th><th>Amount</th></tr></thead><tbody>' +
      bm.map(function(x){ return '<tr><td>' + esc(x.method) + '</td><td>' + money(x.amount) + '</td></tr>'; }).join('') +
      '</tbody></table></div>');
  }

  out += '<h2>What your AI team found</h2>' + panel('Latest analysis',
    '<div id="rep">' + loading('Loading the analysis...') + '</div>');

  setTimeout(function(){
    document.querySelectorAll('[data-range]').forEach(function(b){
      b.onclick = function(){ RANGE = b.getAttribute('data-range'); renderShell(); };
    });
    var pr = document.getElementById('printrep');
    if (pr) pr.onclick = function(){ window.print(); };

    api('/portal/report').then(function(res){
      var el = document.getElementById('rep');
      if (!el) return;
      if (!res.ok) { el.innerHTML = errState('The report service returned ' + res.status + '.'); return; }
      var d = res.data || {};
      if (d.status === 'pending' || !d || Object.keys(d).length === 0) {
        el.innerHTML = empty('Nothing to show yet',
          d.message || 'Your analysis has not produced a report yet.');
        return;
      }
      var rep = d.report || d;
      var client = rep.client || {};
      var summary = rep.summary || {};
      var html = '';
      if (summary.top_priority) {
        html += '<div class="card-note" style="margin-bottom:10px"><strong>Top priority</strong></div>' +
                '<p>' + esc(summary.top_priority) + '</p>';
      }
      var list = function(title, arr, note){
        if (!arr || !arr.length) return '<h3>' + esc(title) + '</h3>' +
          '<div class="card-note">' + esc(note) + '</div>';
        return '<h3>' + esc(title) + '</h3><ul>' +
          arr.map(function(x){ return '<li>' + esc(typeof x === 'string' ? x : JSON.stringify(x)) + '</li>'; }).join('') +
          '</ul>';
      };
      html += list('Strengths', client.strengths, 'The analysis found none to report.');
      html += list('Weaknesses', client.weaknesses, 'The analysis found none to report.');
      if (d.status && d.status !== 'complete') {
        html += '<div class="card-note" style="margin-top:10px">This analysis is ' +
                esc(d.status) + '. It will improve once the missing inputs are in place.</div>';
      }
      html += '<details style="margin-top:14px"><summary class="card-note" style="cursor:pointer">' +
              'The full analysis, as produced</summary>' +
              '<pre class="mono" style="white-space:pre-wrap;margin:8px 0 0;font-size:12px;color:var(--muted)">' +
              esc(JSON.stringify(d, null, 2)) + '</pre></details>';
      el.innerHTML = html;
    });
  }, 0);
  return out;
};


/* ---------- Part 3: Packages ----------
   A package is a name, a price and the things it contains. The contents are
   real rows pointing at real services and products, so a package cannot promise
   a treatment the business does not offer. */

(function addPackagesToNav(){
  var cat = null;
  NAV.forEach(function(g){ if (g.label === 'Catalogue') cat = g; });
  if (!cat) return;
  var already = cat.items.some(function(it){ return it.id === 'packages'; });
  if (!already) cat.items.splice(1, 0, {id:'packages', name:'Packages'});
})();

var OPEN_PACKAGE = null;

VIEWS.packages = function(){
  var out = '<h1>Catalogue / Packages</h1>' +
    '<p class="sub">Bundles you sell as one price. What is inside is listed, not implied.</p>';
  if (!need('packages', '/business/packages'))
    return out + panel('Packages', loading('Loading packages...'));
  if (S.packages === null)
    return out + panel('Packages', errState('The catalogue service did not respond.'));
  need('services', '/business/services');
  need('products', '/business/products');

  out += '<h2>Create a package</h2>' + row() +
    inp('pkname', 'Package name', 'text', 180) +
    inp('pkprice', 'Price', 'number', 110) +
    inp('pkdays', 'Valid for (days)', 'number', 140) +
    '</div>' + row() +
    inp('pkdesc', 'Description', 'text', 220) +
    inp('pkterms', 'Terms', 'text', 180) +
    '<button class="btn primary" id="pkadd">Create</button></div>' + actbar();

  var pkgs = (S.packages && S.packages.items) || [];
  if (!pkgs.length) {
    out += panel('Packages', empty('No packages yet',
      'Create one above, then add the services and products it includes.'));
  } else {
    var body = pkgs.map(function(p){
      return '<tr><td><strong>' + esc(p.name) + '</strong>' +
        (p.description ? '<div class="card-note">' + esc(p.description) + '</div>' : '') + '</td>' +
        '<td>' + money(p.price, p.currency) + '</td>' +
        '<td>' + (p.validity_days ? esc(p.validity_days) + ' days' : '—') + '</td>' +
        '<td>' + (p.active ? '<span class="tag">active</span>' : '—') + '</td>' +
        '<td><button class="btn" data-pkg="' + esc(p.id) + '">' +
        (OPEN_PACKAGE === p.id ? 'Close' : 'Contents') + '</button></td></tr>';
    }).join('');
    out += panel('Packages',
      '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Price</th><th>Valid</th>' +
      '<th>Status</th><th></th></tr></thead><tbody>' + body + '</tbody></table></div>',
      '<span class="pill count">' + pkgs.length + '</span>');
  }

  if (OPEN_PACKAGE) {
    var pkg = null;
    pkgs.forEach(function(p){ if (p.id === OPEN_PACKAGE) pkg = p; });
    var ik = 'pkgitems';
    if (!need(ik, '/business/package_items')) {
      out += panel('Contents', loading('Loading contents...'));
    } else if (S[ik] === null) {
      out += panel('Contents', errState('The package contents could not be read.'));
    } else {
      var svcs = (S.services && S.services.items) || [];
      var prods = (S.products && S.products.items) || [];
      var nameOf = function(list, id){
        var hit = '—';
        list.forEach(function(x){ if (x.id === id) hit = x.name; });
        return hit;
      };
      var items = ((S[ik] && S[ik].items) || []).filter(function(i){
        return i.package_id === OPEN_PACKAGE;
      });
      var inner = items.length
        ? '<div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Kind</th><th>Quantity</th>' +
          '</tr></thead><tbody>' + items.map(function(i){
            var isService = !!i.service_id;
            return '<tr><td>' + esc(isService ? nameOf(svcs, i.service_id) : nameOf(prods, i.product_id)) +
              '</td><td><span class="tag">' + (isService ? 'service' : 'product') + '</span></td>' +
              '<td>' + esc(i.quantity) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : empty('Nothing in this package yet',
                'A package with no contents is a price with nothing behind it. Add at least one item.');

      var picks = svcs.map(function(x){ return {id:'s:' + x.id, name:x.name}; })
        .concat(prods.map(function(x){ return {id:'p:' + x.id, name:x.name}; }));
      inner += '<h3>Add an item</h3>' + row() +
        select('pkitem', picks, 'Pick a service or product') +
        inp('pkqty', 'Quantity', 'number', 110) +
        '<button class="btn primary" id="pkitemadd">Add to package</button></div>' + actbar();

      out += panel('Inside ' + esc(pkg ? pkg.name : 'this package'), inner,
        pkg ? '<span class="tag">' + money(pkg.price, pkg.currency) + '</span>' : '');
    }
  }

  setTimeout(function(){
    document.querySelectorAll('[data-pkg]').forEach(function(b){
      b.onclick = function(){
        var id = b.getAttribute('data-pkg');
        OPEN_PACKAGE = (OPEN_PACKAGE === id) ? null : id;
        renderShell();
      };
    });
    var mk = document.getElementById('pkadd');
    if (mk) mk.onclick = function(){
      var n = val('pkname');
      if (!n) { say('A package needs a name.'); return; }
      act('/business/packages', {method:'POST', body:{
        name: n, price: numv('pkprice'), validity_days: numv('pkdays'),
        description: val('pkdesc') || null, terms: val('pkterms') || null
      }}, 'Package created.').then(function(r){
        if (r.ok) {
          OPEN_PACKAGE = (r.data && r.data.item && r.data.item.id) || null;
          need('packages', '/business/packages', true);
        }
      });
    };
    var ia = document.getElementById('pkitemadd');
    if (ia) ia.onclick = function(){
      var sel = val('pkitem');
      if (!sel) { say('Pick a service or product to add.'); return; }
      var payload = {package_id: OPEN_PACKAGE, quantity: numv('pkqty') || 1};
      if (sel.indexOf('s:') === 0) payload.service_id = sel.slice(2);
      else payload.product_id = sel.slice(2);
      act('/business/package_items', {method:'POST', body: payload},
          'Added to the package.').then(function(r){
        if (r.ok) need('pkgitems', '/business/package_items', true);
      });
    };
  }, 0);
  return out;
};

function currentView(){
  var h = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
  return VIEWS[h] ? h : 'overview';
}
function renderShell(){
  var v = currentView();
  var id = bizIdentity();
  var body;
  try { body = VIEWS[v](); }
  catch (e) { body = errState('Something went wrong rendering this section.'); }
  root.innerHTML =
    '<div class="scrim' + (S.navOpen ? ' on' : '') + '" id="scrim"></div>' +
    '<div class="app">' +
      '<aside class="sidebar' + (S.navOpen ? ' open' : '') + '">' +
        '<div class="brand"><div class="brand-mark">TECH<span>DEVA</span></div></div>' +
        navHTML(v) +
      '</aside>' +
      '<div class="main">' +
        '<header class="topbar">' +
          '<button class="burger" id="burger" aria-label="Menu">&#9776;</button>' +
          '<div class="biz"><div class="biz-name">' + esc(id.name) + '</div>' +
          '<div class="biz-sub">' + esc(id.sub) + '</div></div>' +
          '<button class="btn" id="logout">Sign out</button>' +
        '</header>' +
        '<main class="content">' + body + '</main>' +
      '</div>' +
    '</div>';

  var b = document.getElementById('burger');
  if (b) b.onclick = function(){ S.navOpen = !S.navOpen; renderShell(); };
  var sc = document.getElementById('scrim');
  if (sc) sc.onclick = function(){ S.navOpen = false; renderShell(); };
  var lo = document.getElementById('logout');
  if (lo) lo.onclick = function(){
    api('/auth/logout', {method:'POST'}).then(function(){ S.me = null; gate(); });
  };
}

/* ---------- sign-in gate ---------- */
function gate(msg){
  root.innerHTML =
    '<div class="gate"><div class="gate-box">' +
      '<div class="brand-mark" style="margin-bottom:16px">TECH<span>DEVA</span></div>' +
      '<h1>Sign in</h1><p class="sub">Access your business dashboard.</p>' +
      '<div class="gate-err" id="gerr">' + esc(msg || '') + '</div>' +
      '<div class="field"><label>Email</label><input id="em" type="email" autocomplete="username"></div>' +
      '<div class="field"><label>Password</label><input id="pw" type="password" autocomplete="current-password"></div>' +
      '<button class="btn primary" id="go" style="width:100%;padding:10px">Sign in</button>' +
    '</div></div>';
  var go = document.getElementById('go');
  var err = document.getElementById('gerr');
  function submit(){
    var em = document.getElementById('em').value.trim();
    var pw = document.getElementById('pw').value;
    if (!em || !pw) { err.textContent = 'Enter your email and password.'; return; }
    go.disabled = true; go.textContent = 'Signing in...'; err.textContent = '';
    api('/auth/login', {method:'POST', body:{email:em, password:pw}}).then(function(r){
      go.disabled = false; go.textContent = 'Sign in';
      if (!r.ok) {
        err.textContent = (r.data && (r.data.detail || r.data.message)) ||
          (r.status === 429 ? 'Too many attempts. Please wait and try again.' : 'Sign in failed.');
        return;
      }
      boot();
    });
  }
  go.onclick = submit;
  ['em','pw'].forEach(function(i){
    document.getElementById(i).onkeydown = function(e){ if (e.key === 'Enter') submit(); };
  });
}

/* ---------- boot ---------- */
function boot(){
  root.innerHTML = loading();
  api('/me').then(function(r){
    if (r.status === 401 || r.status === 403) { gate('Your session has expired. Please sign in again.'); return; }
    if (!r.ok || !r.data) { root.innerHTML = errState('The platform did not respond. Please try again.'); return; }
    S.me = r.data;
    if (S.me.auth_enforced && !S.me.authenticated) { gate(); return; }
    if (!S.me.tenant_id) {
      root.innerHTML = '<div class="gate"><div class="gate-box"><h1>No business linked</h1>' +
        '<p class="sub">This account is not attached to a business yet.</p>' +
        '<a class="btn primary" href="/onboarding" style="display:inline-block">Set up your business</a></div></div>';
      return;
    }
    /* Everything below is tenant-scoped by the backend from the session. */
    Promise.all([
      api('/portal/summary'), api('/leads'), api('/portal/config'), api('/portal/deliverables')
    ]).then(function(res){
      S.summary = res[0].ok ? res[0].data : null;
      S.leads   = res[1].ok && res[1].data ? (res[1].data.leads || []) : null;
      S.config  = res[2].ok ? res[2].data : null;
      S.deliv   = res[3].ok && res[3].data ? (res[3].data.deliverables || res[3].data.items || []) : null;
      renderShell();
    });
  });
}

window.addEventListener('hashchange', function(){ S.navOpen = false; if (S.me) renderShell(); });
boot();
</script>
